<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wallpaper Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;font-family:Arial;background:#f4f6fb}
header{background:#111827;color:#fff;padding:18px;font-size:22px}
.grid{display:grid;gap:20px}
.grid.mobile{grid-template-columns:repeat(4,1fr)}
.grid.pc{grid-template-columns:repeat(2,1fr)}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border-radius:12px;overflow:hidden}
.card img{width:100%}
.download{background:#000;color:#fff;text-align:center;padding:10px}
</style>
</head>
<body>

<header>Wallpaper Hub</header>

<div id="home"></div>
<div id="content"></div>

<script>
const BASE = "https://cdn.jsdelivr.net/gh/pyash7102005-cmyk/wallpaper-storage@main/";

async function load() {
  const res = await fetch("data.json");
  const data = await res.json();

  const home = document.getElementById("home");
  home.innerHTML = "<h2>Latest Wallpapers</h2>";

  let count = 0;
  for (const type in data) {
    for (const folder in data[type]) {
      data[type][folder].forEach(img => {
        if (count >= 6) return;
        home.innerHTML += `
          <div class="card">
            <img src="${BASE}${type}/${folder}/${img}">
            <div class="download">Download</div>
          </div>`;
        count++;
      });
    }
  }
}

load();
</script>
</body>
</html>
