<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wallpaper Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; font-family:Arial; background:#f4f6fb; }
header { background:#111827; color:white; padding:18px; font-size:22px; }

.hero {
    text-align:center;
    padding:50px 20px;
    background:linear-gradient(135deg,#1e293b,#020617);
    color:white;
}

.hero button {
    margin:10px;
    padding:14px 36px;
    background:#2563eb;
    border:none;
    border-radius:30px;
    color:white;
    cursor:pointer;
}

.section { padding:30px; }

.grid-mobile {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.grid-pc {
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

@media(max-width:900px){
    .grid-mobile,.grid-pc { grid-template-columns:repeat(2,1fr); }
}
@media(max-width:600px){
    .grid-mobile,.grid-pc { grid-template-columns:1fr; }
}

.card {
    background:white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.2);
}

.card img {
    width:100%;
    display:block;
}

.download {
    background:black;
    color:white;
    padding:10px;
    text-align:center;
    cursor:pointer;
}
</style>
</head>

<body>

<header>Wallpaper Hub</header>

<section class="hero">
    <h1>Premium Wallpapers</h1>
    <button onclick="loadHome()">🏠 Home</button>
    <button onclick="loadCategory('mobile')">📱 Mobile</button>
    <button onclick="loadCategory('pc')">💻 PC</button>
</section>

<div id="home" class="section"></div>
<div id="content" class="section"></div>

<script>
const USER = "pyash7102005-cmyk";
const REPO = "wallpaper-storage";
const API = `https://api.github.com/repos/${USER}/${REPO}/contents`;

async function fetchDir(path) {
    const res = await fetch(`${API}/${path}`);
    return await res.json();
}

function imgURL(path) {
    return `https://raw.githubusercontent.com/${USER}/${REPO}/main/${path}`;
}

/* HOME */
async function loadHome() {
    document.getElementById("content").innerHTML = "";
    const home = document.getElementById("home");
    home.innerHTML = "<h2>🔥 Latest Wallpapers</h2>";

    const mobile = await fetchDir("mobile");
    const pc = await fetchDir("pc");

    let images = [];

    for (let f of mobile) {
        const imgs = await fetchDir(`mobile/${f.name}`);
        imgs.forEach(i => images.push(`mobile/${f.name}/${i.name}`));
    }

    for (let f of pc) {
        const imgs = await fetchDir(`pc/${f.name}`);
        imgs.forEach(i => images.push(`pc/${f.name}/${i.name}`));
    }

    images.slice(0,6).forEach(img => {
        home.innerHTML += `
            <div class="card">
                <img src="${imgURL(img)}">
                <div class="download" onclick="download('${imgURL(img)}')">Download</div>
            </div>`;
    });
}

/* CATEGORY */
async function loadCategory(type) {
    document.getElementById("home").innerHTML = "";
    const content = document.getElementById("content");
    content.innerHTML = "";

    const folders = await fetchDir(type);

    for (let folder of folders) {
        const section = document.createElement("div");
        section.innerHTML = `<h2>${folder.name}</h2>`;

        const grid = document.createElement("div");
        grid.className = type === "mobile" ? "grid-mobile" : "grid-pc";

        const imgs = await fetchDir(`${type}/${folder.name}`);
        imgs.forEach(img => {
            grid.innerHTML += `
                <div class="card">
                    <img src="${imgURL(type+'/'+folder.name+'/'+img.name)}">
                    <div class="download" onclick="download('${imgURL(type+'/'+folder.name+'/'+img.name)}')">Download</div>
                </div>`;
        });

        section.appendChild(grid);
        content.appendChild(section);
    }
}

function download(url) {
    const a = document.createElement("a");
    a.href = url;
    a.download = "";
    a.click();
}

/* INIT */
loadHome();
</script>

</body>
</html>
