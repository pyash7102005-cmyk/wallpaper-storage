<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wallpaper Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6fb;
}

header {
    background: #111827;
    color: white;
    padding: 18px;
    font-size: 22px;
}

.hero {
    text-align: center;
    padding: 50px 20px;
    background: linear-gradient(135deg,#1e293b,#020617);
    color: white;
}

.hero button {
    margin: 10px;
    padding: 14px 36px;
    border: none;
    border-radius: 30px;
    background: #2563eb;
    color: white;
    cursor: pointer;
}

.section {
    padding: 30px;
}

.section h2 {
    border-left: 6px solid #2563eb;
    padding-left: 12px;
}

/* GRID */
.grid-mobile {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 20px;
}

.grid-pc {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 20px;
}

@media(max-width:900px){
    .grid-mobile,.grid-pc { grid-template-columns: repeat(2,1fr); }
}
@media(max-width:600px){
    .grid-mobile,.grid-pc { grid-template-columns: 1fr; }
}

/* CARD */
.card {
    background: white;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(0,0,0,.2);
}

.card img {
    width: 100%;
    display: block;
}

.download {
    background: black;
    color: white;
    text-align: center;
    padding: 10px;
    cursor: pointer;
}
</style>
</head>

<body>

<header>Wallpaper Hub</header>

<section class="hero">
    <h1>Premium Wallpapers</h1>
    <button onclick="loadHome()">🏠 Home</button>
    <button onclick="loadCategory('mobile')">📱 Mobile</button>
    <button onclick="loadCategory('pc')">💻 PC</button>
</section>

<div id="home" class="section"></div>
<div id="content" class="section"></div>

<script>
const USER = "pyash7102005-cmyk";
const REPO = "wallpaper-storage";
const BRANCH = "main";

const BASE = `https://cdn.jsdelivr.net/gh/${USER}/${REPO}@${BRANCH}/`;
const API  = `https://data.jsdelivr.com/v1/package/gh/${USER}/${REPO}@${BRANCH}`;

let TREE = [];

/* LOAD FILE TREE */
async function loadTree() {
    const res = await fetch(API);
    const data = await res.json();
    TREE = data.files;
}

/* HOME PAGE */
function loadHome() {
    document.getElementById("content").innerHTML = "";
    const home = document.getElementById("home");
    home.innerHTML = "<h2>🔥 Latest Wallpapers</h2>";

    const images = TREE.filter(f =>
        f.type === "file" &&
        (f.name.endsWith(".jpg") || f.name.endsWith(".png") || f.name.endsWith(".webp"))
    ).slice(-6);

    images.forEach(img => {
        home.innerHTML += `
            <div class="card">
                <img src="${BASE}${img.name}">
                <div class="download" onclick="download('${BASE}${img.name}')">Download</div>
            </div>`;
    });
}

/* CATEGORY VIEW */
function loadCategory(type) {
    document.getElementById("home").innerHTML = "";
    const content = document.getElementById("content");
    content.innerHTML = "";

    const folders = [...new Set(
        TREE.filter(f => f.name.startsWith(type + "/"))
            .map(f => f.name.split("/")[1])
    )];

    folders.forEach(folder => {
        const section = document.createElement("div");
        section.innerHTML = `<h2>${folder}</h2>`;

        const grid = document.createElement("div");
        grid.className = type === "mobile" ? "grid-mobile" : "grid-pc";

        TREE.filter(f => f.name.startsWith(`${type}/${folder}/`))
            .forEach(img => {
                grid.innerHTML += `
                    <div class="card">
                        <img src="${BASE}${img.name}">
                        <div class="download" onclick="download('${BASE}${img.name}')">Download</div>
                    </div>`;
            });

        section.appendChild(grid);
        content.appendChild(section);
    });
}

/* DOWNLOAD */
function download(url) {
    const a = document.createElement("a");
    a.href = url;
    a.download = "";
    a.click();
}

/* INIT */
(async () => {
    await loadTree();
    loadHome();
})();
</script>

</body>
</html>
