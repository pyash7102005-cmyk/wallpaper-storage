<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Wallpaper Test</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f2f2f2;
}

h1 {
    text-align: center;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.card img {
    width: 100%;
    display: block;
}

button {
    width: 100%;
    padding: 12px;
    background: black;
    color: white;
    border: none;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>Wallpaper Test</h1>

<div class="grid">
    <div class="card">
        <img src="images/mobile1.jpg">
        <button onclick="download('images/mobile1.jpg')">Download</button>
    </div>

    <div class="card">
        <img src="images/mobile2.jpg">
        <button onclick="download('images/mobile2.jpg')">Download</button>
    </div>

    <div class="card">
        <img src="images/pc1.jpg">
        <button onclick="download('images/pc1.jpg')">Download</button>
    </div>

    <div class="card">
        <img src="images/pc2.jpg">
        <button onclick="download('images/pc2.jpg')">Download</button>
    </div>
</div>

<script>
function download(url) {
    const a = document.createElement("a");
    a.href = url;
    a.download = "";
    document.body.appendChild(a);
    a.click();
    a.remove();
}
</script>

</body>
</html>
